<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Dialer - Light Mode</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #1f1f1f;
            --text-secondary: #757575;
            --divider: #f0f0f0;
            --call-green: #00c853;
            --video-yellow: #ffd600;
            --avatar-purple: #b39ddb;
            --avatar-orange: #ffab91;
            --avatar-blue: #90caf9;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Main Phone Container */
        .phone-container {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            font-size: 12px;
            color: var(--text-main);
            font-weight: 500;
        }

        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-right svg {
            width: 14px;
            height: 14px;
            fill: var(--text-main);
        }

        /* App Header */
        .app-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            gap: 20px;
        }

        .header-icon {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .header-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--text-main);
        }

        /* Contact Suggestions */
        .suggestions {
            padding: 0 20px;
            margin-bottom: 20px;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--divider);
            cursor: pointer;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .avatar svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .avatar.purple { background-color: var(--avatar-purple); }
        .avatar.orange { background-color: var(--avatar-orange); }
        .avatar.blue { background-color: var(--avatar-blue); }

        .suggestion-details {
            flex: 1;
            margin-left: 15px;
            min-width: 0;
        }

        .suggestion-name {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestion-number {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: right;
            white-space: nowrap;
        }

        /* Dialed Number Display */
        .dial-display {
            text-align: center;
            font-size: 42px;
            font-weight: 400;
            color: var(--text-main);
            margin: 20px 0 30px;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
        }

        .cursor {
            width: 2px;
            height: 40px;
            background-color: var(--call-green);
            margin-left: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 20px;
            flex: 1;
            align-content: start;
        }

        .key {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.1s;
            user-select: none;
        }

        .key:active {
            background-color: #f0f0f0;
        }

        .key-number {
            font-size: 28px;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.2;
        }

        .key-letters {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Bottom Action Row */
        .bottom-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px 30px;
            margin-top: auto;
        }

        .action-btn {
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .video-btn {
            width: 50px;
            height: 50px;
            background-color: var(--video-yellow);
        }

        .video-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .call-btn {
            width: 70px;
            height: 70px;
            background-color: var(--call-green);
            box-shadow: 0 4px 10px rgba(0, 200, 83, 0.3);
        }

        .call-btn svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .delete-btn {
            width: 50px;
            height: 50px;
            background-color: transparent;
        }

        .delete-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--text-main);
        }

        @media (min-width: 768px) {
            body {
                background-color: #e9eaec;
            }

            .phone-container {
                width: 400px;
                height: 800px;
                max-height: 90vh;
                border-radius: 30px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.15);
                border: 8px solid #1a1a1a;
            }

            /* Adjust status bar for desktop notch style */
            .status-bar {
                padding-top: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span>9:41</span>
            </div>
            <div class="status-right">
                <!-- Signal -->
                <svg viewBox="0 0 24 24"><path d="M2 22h20V2L2 22zm18-2h-3V6.83L20 4.83V20zm-5 0h-3V9.83l3-3V20zm-5 0h-3v-7.17l3-3V20zm-5 0H2v-4.17l3-3V20z"/></svg>
                <!-- Wifi -->
                <svg viewBox="0 0 24 24"><path d="M12.01 21.49L23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l11.63 14.49.01.01.01-.01z"/></svg>
                <!-- Battery -->
                <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <!-- App Header -->
        <header class="app-header">
            <button class="header-icon">
                <!-- Add/Plus Icon -->
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            <button class="header-icon">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="header-icon">
                <!-- Three Dots Menu -->
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </header>

        <!-- Contact Suggestions (Top Area) -->
        <div class="suggestions">
            <!-- Suggestion 1 -->
            <div class="suggestion-item">
                <div class="avatar purple">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="suggestion-details">
                    <div class="suggestion-name">David Smith</div>
                </div>
                <div class="suggestion-number">(555) 019-2834</div>
            </div>

            <!-- Suggestion 2 -->
            <div class="suggestion-item">
                <div class="avatar orange">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="suggestion-details">
                    <div class="suggestion-name">Sarah Johnson</div>
                </div>
                <div class="suggestion-number">(555) 014-9821</div>
            </div>

            <!-- Suggestion 3 -->
            <div class="suggestion-item">
                <div class="avatar blue">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="suggestion-details">
                    <div class="suggestion-name">Michael Brown</div>
                </div>
                <div class="suggestion-number">(555) 017-6543</div>
            </div>
        </div>

        <!-- Dialed Number Display -->
        <div class="dial-display">
            202<span class="cursor"></span>
        </div>

        <!-- Keypad -->
        <div class="keypad">
            <!-- Row 1 -->
            <div class="key">
                <span class="key-number">1</span>
            </div>
            <div class="key">
                <span class="key-number">2</span>
                <span class="key-letters">ABC</span>
            </div>
            <div class="key">
                <span class="key-number">3</span>
                <span class="key-letters">DEF</span>
            </div>

            <!-- Row 2 -->
            <div class="key">
                <span class="key-number">4</span>
                <span class="key-letters">GHI</span>
            </div>
            <div class="key">
                <span class="key-number">5</span>
                <span class="key-letters">JKL</span>
            </div>
            <div class="key">
                <span class="key-number">6</span>
                <span class="key-letters">MNO</span>
            </div>

            <!-- Row 3 -->
            <div class="key">
                <span class="key-number">7</span>
                <span class="key-letters">PQRS</span>
            </div>
            <div class="key">
                <span class="key-number">8</span>
                <span class="key-letters">TUV</span>
            </div>
            <div class="key">
                <span class="key-number">9</span>
                <span class="key-letters">WXYZ</span>
            </div>

            <!-- Row 4 -->
            <div class="key">
                <span class="key-number">*</span>
            </div>
            <div class="key">
                <span class="key-number">0</span>
                <span class="key-letters">+</span>
            </div>
            <div class="key">
                <span class="key-number">#</span>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <!-- Video Call Button -->
            <button class="action-btn video-btn">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>

            <!-- Call Button -->
            <button class="action-btn call-btn">
                <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
            </button>

            <!-- Delete/Backspace Button -->
            <button class="action-btn delete-btn">
                <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
            </button>
        </div>

    </div>

</body>
</html>
