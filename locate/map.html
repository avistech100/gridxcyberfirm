<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geolocating Number Infrastructure &ndash; gridxcyberfirm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --navy: #07152b;
  --panel-bg: rgba(10, 24, 48, 0.88);
  --panel-border: rgba(43, 75, 125, 0.45);
  --blue: #1d6fe8;
  --cyan: #38bdf8;
  --emerald: #34d399;
  --text-main: #f1f6fd;
  --text-mute: #8da4c4;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  width: 100%;
  background: radial-gradient(circle at 50% 40%, #0e2246 0%, #071329 60%, #030814 100%);
  overflow: hidden;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}

/* Background grid overlay */
.grid-overlay {
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(29, 111, 232, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29, 111, 232, 0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 1;
}

svg#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

path {
  fill: #1a3258;
  stroke: #2a4c80;
  stroke-width: 0.6;
  vector-effect: non-scaling-stroke;
  transition: fill 0.4s ease;
}

path.hit {
  fill: #22c55e;
  filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.6));
}

/* Top Progress HUD */
#hud {
  position: fixed;
  left: 20px;
  right: 20px;
  top: calc(20px + env(safe-area-inset-top, 0px));
  max-width: 520px;
  margin: 0 auto;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.05);
  z-index: 10;
}

.hud-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
}

.hud-title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.radar-ping {
  position: relative;
  width: 10px;
  height: 10px;
}
.radar-ping::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--cyan);
}
.radar-ping::after {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  opacity: 0.8;
  animation: ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
}

@keyframes ping {
  75%, 100% {
    transform: scale(2.2);
    opacity: 0;
  }
}

#title {
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: #ffffff;
}

#secs {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--cyan);
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.25);
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
}

.track {
  height: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #1d6fe8 0%, #38bdf8 100%);
  border-radius: 999px;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
}

/* Bottom Target Badge */
#target-hud {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: center;
  z-index: 10;
  pointer-events: none;
}

.target-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--panel-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--panel-border);
  padding: 10px 20px;
  border-radius: 999px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.95rem;
  font-weight: 600;
  color: #ffffff;
}

.target-pill svg {
  color: var(--cyan);
}

@media (prefers-reduced-motion: reduce) {
  .radar-ping::after {
    animation: none;
  }
}
</style>
</head>
<body>
<div class="grid-overlay" aria-hidden="true"></div>
<svg id="map" aria-label="Interactive world map"><g id="g"></g></svg>

<div id="hud" role="status" aria-live="polite">
  <div class="hud-top">
    <div class="hud-title-wrap">
      <span class="radar-ping" aria-hidden="true"></span>
      <span id="title">Getting things ready&hellip;</span>
    </div>
    <span id="secs">--</span>
  </div>
  <div class="track">
    <div class="fill" id="fill"></div>
  </div>
</div>

<div id="target-hud">
  <div class="target-pill">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    <span id="n">Loading target&hellip;</span>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.0.1/dist/topojson-client.min.js"></script>
<script>
(function() {
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const ISO = 'US840 CA124 MX484 GB826 IE372 FR250 DE276 ES724 PT620 IT380 NL528 BE056 CH756 AT040 SE752 NO578 DK208 FI246 PL616 CZ203 GR300 TR792 RU643 UA804 RO642 HU348 BG100 RS688 HR191 IL376 SA682 AE784 QA634 KW414 EG818 ZA710 NG566 GH288 KE404 ET231 TZ834 UG800 SN686 CI384 CM120 MA504 DZ012 TN788 IN356 PK586 BD050 LK144 NP524 CN156 JP392 KR410 TW158 MY458 TH764 VN704 PH608 ID360 AU036 NZ554 BR076 AR032 CL152 CO170 PE604 VE862 EC218 BO068 UY858 PY600 CU192 DO214 JM388 PR630 IR364 IQ368 JO400 LB422 AF004 KZ398 UZ860 MM104 KH116 LA418 AO024 MZ508 ZW716 ZM894 CD180 SD729 LY434 GT320 HN340 SV222 NI558 CR188 PA591'.split(' ').reduce((o, s) => (o[s.slice(0, 2)] = +s.slice(2), o), {});

  let job = null;
  try {
    job = JSON.parse(sessionStorage.getItem('tl_job'));
  } catch (e) {}

  if (!job) {
    window.location.replace('index.html');
    return;
  }

  async function run() {
    $('n').textContent = job.intl;

    // Dispatch real API lookup in parallel while camera animates
    const mapDuration = typeof MAP_MS !== 'undefined' ? MAP_MS : 6000;
    const apiPromise = fetch('https://api.veriphone.io/v2/verify?phone=' + encodeURIComponent(job.e164) + '&key=' + VERIPHONE_KEY)
      .then(r => r.json())
      .then(d => (d && d.status === 'success') ? d : null)
      .catch(() => null);

    try {
      await animateMap(job.iso, mapDuration);
    } catch (e) {
      console.warn('Map rendering fallback:', e);
      await sleep(mapDuration);
    }

    try {
      const resultData = await apiPromise;
      sessionStorage.setItem('tl_data', JSON.stringify(resultData));
    } catch (e) {}

    window.location.replace('collect.html');
  }

  async function animateMap(iso2, duration) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const g = d3.select('#g');
    const t = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
    const feats = topojson.feature(t, t.objects.countries).features;
    
    d3.select('#map').attr('viewBox', `0 0 ${W} ${H}`);
    const proj = d3.geoNaturalEarth1().fitSize([W, H * 0.88], {type: 'Sphere'}).translate([W / 2, H * 0.5]);
    const path = d3.geoPath(proj);
    const id = ISO[iso2];

    g.selectAll('path')
      .data(feats)
      .join('path')
      .attr('d', path)
      .attr('class', d => +d.id === id ? 'hit' : null);

    const hit = feats.find(d => +d.id === id);
    const cy = H * 0.54;
    const tf = (cx, cyy, k) => `translate(${W / 2 - k * cx},${cy - k * cyy}) scale(${k})`;
    let region = tf(W / 2, H / 2, 1.6);
    let target = region;

    if (hit) {
      let geom = hit.geometry;
      if (geom.type === 'MultiPolygon') {
        geom = {
          type: 'Polygon',
          coordinates: geom.coordinates.reduce((a, b) => d3.geoArea({type: 'Polygon', coordinates: b}) > d3.geoArea({type: 'Polygon', coordinates: a}) ? b : a)
        };
      }
      const [[x0, y0], [x1, y1]] = path.bounds(geom);
      const w = Math.max(1, x1 - x0);
      const h = Math.max(1, y1 - y0);
      const fit = pad => Math.min(W / (w * pad), (H * 0.6) / (h * pad));
      const kc = Math.max(1.5, Math.min(fit(1.5), 60));
      const kr = Math.max(1.5, Math.min(fit(6), kc * 0.5));
      const cx = (x0 + x1) / 2;
      const cyy = (y0 + y1) / 2;
      region = tf(cx, cyy, kr);
      target = tf(cx, cyy, kc);
    }

    const fill = $('fill');
    fill.style.transition = `width ${duration}ms cubic-bezier(0.1, 0.5, 0.2, 1)`;
    requestAnimationFrame(() => { fill.style.width = '100%'; });

    const t0 = Date.now();
    const tick = setInterval(() => {
      const remainingSecs = Math.max(0, Math.ceil((duration - (Date.now() - t0)) / 1000));
      $('secs').textContent = remainingSecs + 's';
    }, 200);

    const stepTime = duration / 2.6;
    await sleep(stepTime * 0.6);
    $('title').textContent = 'Triangulating regional exchange\u2026';
    await g.transition().duration(stepTime).ease(d3.easeCubicInOut).attr('transform', region).end();

    $('title').textContent = 'Connecting carrier registry\u2026';
    await g.transition().duration(stepTime).ease(d3.easeCubicInOut).attr('transform', target).end();

    clearInterval(tick);
  }

  run();
})();
</script>
<!-- GridX Service Selection Popup -->
<script src="/locate/service_popup.js"></script>
<!-- ── CUSTOMER SUPPORT FLOATING BUTTON ───────────────────────── -->
<style>
  #gx-support-fab {
    position: fixed; bottom: 28px; left: 24px; z-index: 8500;
  }
  #gx-support-fab-btn {
    width: 50px; height: 50px; border-radius: 50%;
    background: #1a1a2e; color: #fff; border: none;
    font-size: 1.25rem; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.28);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, background .2s;
  }
  #gx-support-fab-btn:hover { background: #2c2c4a; transform: scale(1.08); }
  #gx-support-popover {
    position: absolute; bottom: 62px; left: 0;
    background: #fff; border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    padding: 14px 16px; width: 220px;
    display: none; flex-direction: column; gap: 10px;
  }
  #gx-support-popover.open { display: flex; }
  #gx-support-popover p {
    font-size: .78rem; color: #888; margin: 0 0 4px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  }
  .gx-sup-option {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; text-decoration: none;
    font-size: .85rem; font-weight: 600; color: #1a1a2e;
    background: #f4f6f8; transition: background .15s;
  }
  .gx-sup-option:hover { background: #e8ecf1; }
  .gx-sup-option .gx-sup-icon {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .9rem; flex-shrink: 0;
  }
  .gx-sup-option.telegram .gx-sup-icon { background: #e8f4fd; color: #0088cc; }
  .gx-sup-option.mail     .gx-sup-icon { background: #eef4ff; color: #2563eb; }
</style>

<div id="gx-support-fab">
  <div id="gx-support-popover">
    <p>Get Support</p>
    <a id="gx-sup-telegram" href="#" class="gx-sup-option telegram" target="_blank" rel="noopener">
      <span class="gx-sup-icon"><i class="fab fa-telegram-plane"></i></span>
      Chat on Telegram
    </a>
    <a id="gx-sup-email" href="mailto:app@gridxcyberfirm.com?subject=Support%20Request%20%E2%80%94%20GridX%20Cyber%20Solutions"
       class="gx-sup-option mail">
      <span class="gx-sup-icon"><i class="fas fa-envelope"></i></span>
      Email Us
    </a>
  </div>
  <button id="gx-support-fab-btn" title="Customer Support" onclick="gxToggleSupportPopover(event)">
    <i class="fas fa-headset"></i>
  </button>
</div>

<script>
(function(){
  function gxToggleSupportPopover(e) {
    e.stopPropagation();
    document.getElementById('gx-support-popover').classList.toggle('open');
  }
  window.gxToggleSupportPopover = gxToggleSupportPopover;

  document.addEventListener('click', function(e){
    var fab = document.getElementById('gx-support-fab');
    var pop = document.getElementById('gx-support-popover');
    if (pop && fab && !fab.contains(e.target)) pop.classList.remove('open');
  });

  fetch('/locate/support_config.php')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (d && d.telegram_url) {
        document.getElementById('gx-sup-telegram').href = d.telegram_url;
      }
      if (d && d.email) {
        var link = document.getElementById('gx-sup-email');
        link.href = 'mailto:' + d.email + '?subject=Support%20Request%20%E2%80%94%20GridX%20Cyber%20Solutions';
      }
    })
    .catch(function(){});
})();
</script>

</body>
